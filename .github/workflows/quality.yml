name: Frontend quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verify assets retained for already-open tabs
        run: python3 -m unittest discover -s tools/publication -p 'test_*.py'
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Check the reviewed production archive contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jenngllg/mon-kado
          ref: cc0beca4dfb754977246f99533bfbab4a811a7e0
          path: .publication-backend
          persist-credentials: false
      - name: Package the build using the production allowlist
        shell: bash
        run: |
          set -euo pipefail
          configuration_hash=$(python3 .publication-backend/deployments/production/release_manifest.py hash)
          google_enabled=$(node --input-type=module -e 'import p from "./publication.json" with { type: "json" }; console.log(String(p.googleEnabled))')
          python3 .publication-backend/src/Operations.Frontend/frontend_cli.py package \
            --dist dist --output "$RUNNER_TEMP/frontend-quality-package" --revision "$GITHUB_SHA" \
            --backend-revision cc0beca4dfb754977246f99533bfbab4a811a7e0 \
            --configuration-hash "$configuration_hash" --google-enabled "$google_enabled"
      - name: Validate deployed Caddy configuration
        run: >-
          docker run --rm --network none
          --mount type=bind,src=${{ github.workspace }}/deployments/caddy/Caddyfile,dst=/etc/caddy/Caddyfile,readonly
          --mount type=bind,src=${{ github.workspace }}/dist,dst=/srv/frontend,readonly
          -e FRONTEND_HOST=http://:8080 -e FRONTEND_ROOT=/srv/frontend
          -e FRONTEND_API_ORIGIN=https://api.example.test
          caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile
      - name: Retain the verified production build for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-production-build
          path: dist/
          retention-days: 1
          if-no-files-found: error

  browser:
    name: Chromium (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - name: Keep synthetic browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            .e2e-results/
          retention-days: 3
          if-no-files-found: ignore

  contract:
    name: Backend OpenAPI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HTTP_ADDRESS: '127.0.0.1:7000'
      FRONTEND_ORIGIN: http://localhost:5173
      ALLOWED_HOSTS: localhost,127.0.0.1
      GOOGLE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Check out the matching backend contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jenngllg/mon-kado
          # Validate paired releases before their backend merge; develop checks its current backend contract.
          ref: ${{ github.head_ref == 'codex/all-local-production-20261106' && '2d55a4805b5652b75b6d534aac014f9d6339694c' || github.head_ref == 'codex/all-local-production-20261104' && '8ac07df638bab754e546311b71a2f0ffe11b4ea3' || github.head_ref == 'codex/notification-preferences' && 'b0912a13b5fe0c6ac9d3b631a0cfd2f4b19fadaa' || github.head_ref == 'codex/compatible-session-loading' && 'eec6c078d60ef28c6f3659575b69fbaef8997827' || github.head_ref == 'codex/notifications-responsive-production-20261103' && 'f38093556273520662e6a40a916d00c5099d480c' || github.head_ref == 'codex/image-pipeline-production' && '5c86bac103a10d07758dfe52f15c2c423380944b' || github.head_ref == 'codex/extension-surprise-release' && '296fccc09b5f30ef6fa1ed3e2b4a57399fb75cff' || github.head_ref == 'codex/complete-production-20261101' && '52aa836576681118262b723987cdcbf4773b13a2' || github.head_ref == 'codex/MK-1008-frontend-native-contract' && '84e665b570694fc829869494d2c04999778e09ff' || github.head_ref == 'codex/admin-bool-session' && '6e8bed08f02b1509c3414777d2a58523cf18cdb0' || github.head_ref == 'codex/admin-boolean-only' && 'd6b4b6c913769cccfb5e9d8ce0a890c35faa5817' || ((github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'main' || 'develop') }}
          path: .backend
          persist-credentials: false
      - name: Set up native Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .backend/go.mod
          cache-dependency-path: .backend/go.sum
      - name: Initialize isolated native PostgreSQL
        run: bash .backend/scripts/Initialize-CIPostgres.sh
      - name: Record backend revision and generate disposable keys
        shell: bash
        run: |
          set -euo pipefail
          git -C .backend rev-parse HEAD
          for name in JWT_SIGNING_KEY DATA_ENCRYPTION_KEY; do
            key=$(openssl rand -base64 32)
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - name: Build native API and migration tool without Worker
        working-directory: .backend
        run: |
          go build -o "$RUNNER_TEMP/monkado-contract-api" ./cmd/api
          go build -o "$RUNNER_TEMP/monkado-contract-migrate" ./cmd/migrate
      - name: Check the served native OpenAPI contract
        shell: bash
        env:
          DATABASE_URL: ${{ env.MONKADO_TEST_DATABASE_URL }}
          MONKADO_OPENAPI_URL: http://localhost:7000/openapi/v1.json
          IMAGE_PATH: ${{ runner.temp }}/monkado-contract-images
          EXPORT_PATH: ${{ runner.temp }}/monkado-contract-exports
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/monkado-contract-migrate"
          "$RUNNER_TEMP/monkado-contract-api" > "$RUNNER_TEMP/monkado-contract-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 5 \
            "$MONKADO_OPENAPI_URL" --output "$RUNNER_TEMP/contract.json"
          pnpm api:types:check
          cmp "$RUNNER_TEMP/contract.json" .backend/internal/httpapi/specification.json
          mkdir -p "$RUNNER_TEMP/frontend-backend-proof"
          backend_revision=$(git -C .backend rev-parse HEAD)
          contract_hash=$(sha256sum "$RUNNER_TEMP/contract.json" | cut -d' ' -f1)
          jq -n --arg backend "$backend_revision" --arg contract "$contract_hash" \
            '{backendRevision: $backend, openapiSha256: $contract}' > "$RUNNER_TEMP/frontend-backend-proof/proof.json"
      - name: Retain the exact native backend contract proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-backend-proof
          path: ${{ runner.temp }}/frontend-backend-proof/
          retention-days: 1
          if-no-files-found: error
      - name: Remove disposable native PostgreSQL cluster
        # The browser suite uses a separately generated child database, never this parent.
        if: always()
        run: |
          if pg_lsclusters --no-header | grep -q '^18[[:space:]]\+monkado[[:space:]]'; then
            sudo pg_dropcluster --stop 18 monkado
          fi

  native-browser:
    name: Native API browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jenngllg/mon-kado
          ref: ${{ github.head_ref == 'codex/all-local-production-20261106' && '2d55a4805b5652b75b6d534aac014f9d6339694c' || github.head_ref == 'codex/all-local-production-20261104' && '8ac07df638bab754e546311b71a2f0ffe11b4ea3' || github.head_ref == 'codex/notification-preferences' && 'b0912a13b5fe0c6ac9d3b631a0cfd2f4b19fadaa' || github.head_ref == 'codex/compatible-session-loading' && 'eec6c078d60ef28c6f3659575b69fbaef8997827' || github.head_ref == 'codex/notifications-responsive-production-20261103' && 'f38093556273520662e6a40a916d00c5099d480c' || github.head_ref == 'codex/image-pipeline-production' && '5c86bac103a10d07758dfe52f15c2c423380944b' || github.head_ref == 'codex/extension-surprise-release' && '296fccc09b5f30ef6fa1ed3e2b4a57399fb75cff' || github.head_ref == 'codex/complete-production-20261101' && '52aa836576681118262b723987cdcbf4773b13a2' || github.head_ref == 'codex/MK-1008-frontend-native-contract' && '84e665b570694fc829869494d2c04999778e09ff' || github.head_ref == 'codex/admin-bool-session' && '6e8bed08f02b1509c3414777d2a58523cf18cdb0' || github.head_ref == 'codex/admin-boolean-only' && 'd6b4b6c913769cccfb5e9d8ce0a890c35faa5817' || ((github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'main' || 'develop') }}
          path: .backend
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .backend/go.mod
          cache-dependency-path: .backend/go.sum
      - name: Initialize isolated native PostgreSQL
        run: bash .backend/scripts/Initialize-CIPostgres.sh
      - run: python3 -m unittest discover -s tools/native-e2e -p 'test_*.py'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run real frontend, API, worker and PostgreSQL journeys
        env:
          MONKADO_BACKEND_SOURCE: ${{ github.workspace }}/.backend
        run: pnpm test:e2e:native
      - name: Retain native journey diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-browser-failure
          include-hidden-files: true
          path: |
            native-playwright-report/
            .native-e2e-results/
            .local/native-e2e/run-*/api.log
            .local/native-e2e/run-*/worker.log
            .local/native-e2e/run-*/setup.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Remove disposable native PostgreSQL cluster
        if: always()
        run: |
          if pg_lsclusters --no-header | grep -q '^18[[:space:]]\+monkado[[:space:]]'; then
            sudo pg_dropcluster --stop 18 monkado
          fi

  gate:
    name: Frontend quality gate
    if: always()
    needs: [quality, contract, browser, native-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          NATIVE_BROWSER_RESULT: ${{ needs.native-browser.result }}
        run: test "$QUALITY_RESULT" = success && test "$CONTRACT_RESULT" = success && test "$BROWSER_RESULT" = success && test "$NATIVE_BROWSER_RESULT" = success
