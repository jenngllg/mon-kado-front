name: Deploy frontend main to VPS

on:
  workflow_run:
    workflows: [Frontend quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      temporary_test:
        description: 'Authorized publication with draft legal documents; keep the site online'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-production-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success'
    env:
      RELEASE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require main-only automatic production and green checks for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'jenngllg/mon-kado-front'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_REVISION"
          gh api "repos/$GITHUB_REPOSITORY/environments/production" \
            --jq '.deployment_branch_policy == {"protected_branches":false,"custom_branch_policies":true} and ([.protection_rules[]? | select(.type != "branch_policy")] | length == 0)' | grep -x true
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" \
            --jq '[.branch_policies[] | {name,type}] == [{"name":"main","type":"branch"}]' | grep -x true
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$RELEASE_REVISION&branch=main&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.run_number) | last | .conclusion' \
            | grep -x success
      - name: Resolve the explicitly published backend
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_PUBLICATION_WAIT_SECONDS: '600'
        run: |
          set -euo pipefail
          main_revision=$(gh api repos/jenngllg/mon-kado/git/ref/heads/main --jq .object.sha)
          deadline=$((SECONDS + BACKEND_PUBLICATION_WAIT_SECONDS))
          while true; do
            test "$(gh api repos/jenngllg/mon-kado/git/ref/heads/main --jq .object.sha)" = "$main_revision" || { echo 'BACKEND_MAIN_CHANGED'; exit 1; }
            gh api repos/jenngllg/mon-kado/releases/tags/backend-production > "$RUNNER_TEMP/backend-release.json"
            revision=$(jq -er '.body | fromjson | .revision | select(type == "string" and length == 40 and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/backend-release.json")
            [ "$revision" != "$main_revision" ] || break
            [ "$SECONDS" -lt "$deadline" ] || { echo 'BACKEND_PUBLICATION_TIMEOUT'; exit 1; }
            echo 'Waiting for the checked backend main publication.'
            sleep 10
          done
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jenngllg/mon-kado
          ref: ${{ steps.backend.outputs.revision }}
          path: .backend
          persist-credentials: false
      - name: Validate reviewed deployment configuration
        run: python3 .backend/deployments/production/release_manifest.py release "$RUNNER_TEMP/backend-release.json" > "$RUNNER_TEMP/backend-images.env"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Reuse the successful quality run's build and native contract proof
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_REVISION: ${{ steps.backend.outputs.revision }}
        run: |
          set -euo pipefail
          ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$RELEASE_REVISION&branch=main&per_page=100" --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.run_number) | last | .id')
          gh run download "$ci_run" --repo "$GITHUB_REPOSITORY" --name frontend-production-build --dir dist
          gh run download "$ci_run" --repo "$GITHUB_REPOSITORY" --name frontend-backend-proof --dir "$RUNNER_TEMP/verified-contract"
          test "$(jq -er .backendRevision "$RUNNER_TEMP/verified-contract/proof.json")" = "$BACKEND_REVISION"
          contract_hash=$(sha256sum .backend/internal/httpapi/specification.json | cut -d' ' -f1)
          test "$(jq -er .openapiSha256 "$RUNNER_TEMP/verified-contract/proof.json")" = "$contract_hash"
      - name: Require approved legal documents and revision-bound Google setting
        id: publication
        env:
          TEMPORARY_TEST: ${{ github.event_name == 'workflow_run' || inputs.temporary_test }}
        run: |
          if [ "$TEMPORARY_TEST" = true ]; then
            node tools/publication/checkPublication.js --temporary-test >> "$GITHUB_OUTPUT"
            echo 'Publication with draft legal documents authorized by Jenn; keep the site online. This is not legal approval.' >> "$GITHUB_STEP_SUMMARY"
          else
            node tools/publication/checkPublication.js >> "$GITHUB_OUTPUT"
          fi
      - name: Keep recent approved assets available to already-open tabs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publication/retain_assets.py .backend dist "$RELEASE_REVISION"
      - name: Package only static build files
        env:
          BACKEND_REVISION: ${{ steps.backend.outputs.revision }}
          GOOGLE_ENABLED: ${{ steps.publication.outputs.googleEnabled }}
        run: |
          set -euo pipefail
          configuration_hash=$(python3 .backend/deployments/production/release_manifest.py hash)
          python3 .backend/src/Operations.Frontend/frontend_cli.py package \
            --dist dist --output "$RUNNER_TEMP/frontend-package" --revision "$RELEASE_REVISION" \
            --backend-revision "$BACKEND_REVISION" --configuration-hash "$configuration_hash" \
            --google-enabled "$GOOGLE_ENABLED"
          contract_hash=$(jq -er .openapiSha256 "$RUNNER_TEMP/verified-contract/proof.json")
          jq -n --arg frontend "$RELEASE_REVISION" --arg backend "$BACKEND_REVISION" \
            --arg config "$configuration_hash" --arg contract "$contract_hash" \
            '{schemaVersion: 1, frontendRevision: $frontend, backendRevision: $backend, configurationHash: $config, openapiSha256: $contract}' \
            > "$RUNNER_TEMP/frontend-package/coordinated-proof.json"
      - name: Publish immutable build before changing the production pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Existing immutable versions are never overwritten; rollback selects their manifest.
          if gh release view "frontend-$RELEASE_REVISION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "frontend-$RELEASE_REVISION" --repo "$GITHUB_REPOSITORY" \
              --pattern frontend.tar.gz --pattern manifest.json --pattern coordinated-proof.json --dir "$RUNNER_TEMP/existing-frontend"
            cmp "$RUNNER_TEMP/existing-frontend/manifest.json" "$RUNNER_TEMP/frontend-package/manifest.json"
            cmp "$RUNNER_TEMP/existing-frontend/frontend.tar.gz" "$RUNNER_TEMP/frontend-package/frontend.tar.gz"
            cmp "$RUNNER_TEMP/existing-frontend/coordinated-proof.json" "$RUNNER_TEMP/frontend-package/coordinated-proof.json"
          else
            gh release create "frontend-$RELEASE_REVISION" "$RUNNER_TEMP/frontend-package/frontend.tar.gz" \
              "$RUNNER_TEMP/frontend-package/manifest.json" "$RUNNER_TEMP/frontend-package/coordinated-proof.json" --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_REVISION" --title "Frontend $RELEASE_REVISION" --notes 'Approved static frontend build.' --latest=false
          fi
          gh api repos/jenngllg/mon-kado/releases/tags/backend-production > "$RUNNER_TEMP/backend-recheck.json"
          jq -S .body "$RUNNER_TEMP/backend-release.json" > "$RUNNER_TEMP/backend-before.json"
          jq -S .body "$RUNNER_TEMP/backend-recheck.json" > "$RUNNER_TEMP/backend-after.json"
          cmp "$RUNNER_TEMP/backend-before.json" "$RUNNER_TEMP/backend-after.json"
          if gh release view frontend-production --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit frontend-production --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/frontend-package/manifest.json" --latest=false
          else
            gh release create frontend-production --repo "$GITHUB_REPOSITORY" --target "$RELEASE_REVISION" \
              --title 'Approved frontend production build' --notes-file "$RUNNER_TEMP/frontend-package/manifest.json" --latest=false
          fi
      - name: Wait for both checked main publications
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .backend/scripts/wait_paired_publication.py frontend "$RELEASE_REVISION"
      - name: Deploy the approved main revision to the VPS
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: bash scripts/Deploy-MainVPS.sh "$RELEASE_REVISION"
