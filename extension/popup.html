<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ajouter à MonKado</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <div class="brand"><img src="icon.png" alt=""> MonKado<span>.</span></div>
  <h1>Ajouter un souhait</h1>
  <div id="modes" class="destination-modes" aria-label="Destination du souhait" hidden>
    <button id="own-mode" type="button" aria-pressed="true">Mes souhaits</button>
    <button id="suggestion-mode" type="button" aria-pressed="false">Idée surprise</button>
  </div>
  <p id="status" role="status">Chargement…</p>
  <form id="form" hidden>
    <label>Liste *<select id="list" required></select></label>
    <label>Nom du souhait *<input id="name" data-field="name" maxlength="100" required></label>
    <label>Prix en euros<input id="price" data-field="price" inputmode="decimal"></label>
    <label class="favorite-control"><input type="checkbox" data-field="favorite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>Coup de cœur</span></label>
    <details class="variants">
      <summary>Ajouter une couleur ou une taille</summary>
      <div class="variants-fields">
        <label>Couleur<input id="color" data-field="color" maxlength="100" placeholder="Ex. : vert sauge"></label>
        <label>Taille / dimensions<input id="size" data-field="size" maxlength="100" placeholder="Ex. : M, 39, 140 × 200 cm"></label>
      </div>
    </details>
    <fieldset id="images" hidden><legend>Choisir une image</legend>
      <div class="image-choices" data-image-choices></div>
      <p class="image-status" data-image-status role="status">Choisis une image ou continue sans image.</p>
      <button class="image-clear" type="button" data-image-clear>Sans image</button>
    </fieldset>
    <button id="add" type="submit">Ajouter</button>
  </form>
</main><script type="module" src="popup.js"></script></body></html>
